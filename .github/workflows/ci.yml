name: TrustDrive CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:      # opt-in: also run the Playwright E2E

jobs:
  web:
    name: TypeScript / Vitest / Next build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit + component tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  intelligence:
    name: Pytest (FastAPI, detectors, agent, worker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-render.txt
      - name: Install slim runtime + pytest
        run: python -m pip install -r backend/requirements-render.txt
      - name: Pytest
        working-directory: backend
        run: python -m pytest -q
        env:
          TD_LLM_PROVIDER: none
      - name: Import smoke test (OpenAPI generation)
        working-directory: backend
        run: python -c "from app.main import app; print(len(app.openapi()['paths']), 'paths')"

  docker:
    name: Docker image (Dockerfile.render)
    runs-on: ubuntu-latest
    needs: [web, intelligence]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build combined image
        run: docker build -f Dockerfile.render -t trustdrive:ci .
        env:
          DOCKER_BUILDKIT: "1"

  blueprint:
    name: Render blueprint syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Validate render.yaml
        run: |
          python - <<'PY'
          import yaml
          d = yaml.safe_load(open("render.yaml"))
          svc = d["services"][0]
          assert svc["type"] == "web"
          assert svc["healthCheckPath"] == "/api/v1/health/ready"
          assert svc["disk"]["mountPath"] == "/data"
          print("render.yaml OK:", svc["name"])
          PY

  e2e:
    name: Playwright E2E (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [web, intelligence]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
        working-directory: frontend
      - run: python -m pip install -r backend/requirements-render.txt
      - run: npx playwright install --with-deps chromium
      - name: Seed the shared demo database
        run: npm run seed:reset
      - name: Start intelligence service
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --app-dir . --host 127.0.0.1 --port 8000 > /tmp/intel.log 2>&1 &
      - name: Run E2E
        run: npm run test:e2e -- --project=chromium-1920
        env:
          CI: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
